name: BDD / Cucumber Tests

on:
  push:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  bdd:
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 18.x

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Chromium
      run: npx playwright install chromium --with-deps

    - name: Run Cucumber BDD scenarios (all)
      id: bdd
      continue-on-error: true
      run: |
        mkdir -p quality-gate
        # Run all scenarios including @cloudflare (uses "ci" profile in cucumber.json).
        # Note: @cloudflare-tagged UI scenarios may be blocked by Cloudflare in GitHub Actions.
        npx cucumber-js \
          --profile ci \
          --format progress \
          --format json:quality-gate/cucumber.json \
          --format html:quality-gate/cucumber.html \
          2>&1 | tee quality-gate/raw.log || true
        echo "--- quality-gate contents ---"
        ls -la quality-gate/ || true
      env:
        BASE_URL: ${{ vars.BASE_URL }}
        API_URL: ${{ vars.API_URL }}

    - name: BDD quality gate
      run: |
        node <<'NODE'
        const fs = require('fs');

        // Primary: parse Cucumber summary from raw.log (robust across cucumber-js JSON format quirks)
        let total = 0, passed = 0, failed = 0;
        try {
          const raw = fs.readFileSync('quality-gate/raw.log', 'utf8');
          // Examples: "6 scenarios (6 failed)" / "6 scenarios (1 failed, 5 passed)" / "6 scenarios (6 passed)"
          const sm = raw.match(/(\d+)\s+scenarios?\s*\(([^)]+)\)/i);
          if (sm) {
            total = parseInt(sm[1], 10);
            const detail = sm[2];
            const fm = detail.match(/(\d+)\s+failed/i); if (fm) failed = parseInt(fm[1], 10);
            const pm = detail.match(/(\d+)\s+passed/i); if (pm) passed = parseInt(pm[1], 10);
          }
        } catch (e) {}

        // Fallback: try cucumber.json if raw parsing found nothing
        if (total === 0) {
          try {
            const path = 'quality-gate/cucumber.json';
            if (fs.existsSync(path)) {
              const data = JSON.parse(fs.readFileSync(path, 'utf8'));
              const features = Array.isArray(data) ? data : (data && data.features) ? data.features : [];
              function walk(elements) {
                for (const el of (elements || [])) {
                  const isScenario = el.type === 'scenario' || el.keyword === 'Scenario' || el.keyword === 'Scenario Outline';
                  if (isScenario) {
                    total++;
                    const st = (el.result && el.result.status) || (el.steps || []).some(s => s.result && s.result.status === 'failed') ? (el.result?.status || (el.steps || []).some(s => s.result?.status === 'failed') ? 'failed' : 'unknown') : 'passed';
                    if (st === 'passed') passed++; else if (st === 'failed') failed++;
                  }
                  if (el.elements) walk(el.elements);
                }
              }
              for (const feature of features) walk(feature.elements);
            }
          } catch (e) {}
        }

        console.log(`BDD scenarios: total=${total} passed=${passed} failed=${failed}`);
        if (total === 0) {
          console.error('QUALITY GATE FAILED: no scenarios executed.');
          try { console.error(fs.readFileSync('quality-gate/raw.log','utf8').slice(-4000)); } catch(e) {}
          process.exit(1);
        }
        if (failed > 0) {
          console.error(`QUALITY GATE FAILED: ${failed} scenario(s) failed (all executed scenarios must pass).`);
          process.exit(1);
        }
        if (passed !== total) {
          console.error(`QUALITY GATE FAILED: not all scenarios passed (${passed}/${total}).`);
          process.exit(1);
        }
        console.log('QUALITY GATE PASSED (all executed scenarios passed)');
        NODE

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: bdd-report
        path: quality-gate/
        retention-days: 30
        if-no-files-found: warn
